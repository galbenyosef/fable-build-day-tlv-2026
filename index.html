<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tel Aviv 2035</title>
  </head>
  <body>
    <div id="map"></div>

    <section id="panel" class="panel">
      <h1>Tel Aviv 2035 <span id="mode" class="mode-pill">Today</span></h1>
      <form id="address-form" autocomplete="off">
        <input
          id="address"
          type="text"
          dir="rtl"
          value="המרד 25"
          placeholder="רחוב ומספר"
          aria-label="כתובת"
        />
        <button type="submit">Go</button>
      </form>
      <div id="status" class="status" aria-live="polite">Loading map…</div>
      <label class="slider-row">
        <span>Aerial</span>
        <input id="year" type="range" min="0" max="12" step="1" value="12" />
        <output id="year-label" for="year">2025</output>
      </label>
      <label class="check-row">
        <input id="show-2035" type="checkbox" disabled />
        <span>Show 2035</span>
        <a id="reread" class="reread" href="#" hidden title="Clear the cache for this area and read the permits again live">re-read</a>
      </label>
      <ul class="legend" aria-label="Legend">
        <li><span class="swatch swatch-years"></span>cream to grey: today's buildings, older to newer</li>
        <li><span class="swatch" style="background: #8d9096"></span>mid grey: year unknown</li>
        <li><span class="swatch" style="background: #3b5bdb"></span>solid blue: permit issued, height read by Fable</li>
        <li><span class="swatch" style="background: #f06595; opacity: 0.7"></span>pink: plan deposited, indicative height</li>
        <li><span class="swatch" style="background: #748ffc; opacity: 0.7"></span>pale blue: plan approved, indicative height</li>
      </ul>
    </section>

    <aside id="card" class="card" hidden>
      <button id="card-close" class="card-close" aria-label="Close">×</button>
      <div id="card-body"></div>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
